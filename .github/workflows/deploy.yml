name: Deploy
on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Job-level so the step `if:` below can see it. `secrets.*` cannot be referenced in a step
    # `if:` at all (the workflow fails to parse and the run dies with no jobs), and a step's own
    # `env:` is not visible to its own `if:` either. Job env is the one place that works.
    env:
      EMAIL_API_KEY: ${{ secrets.EMAIL_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      # Gate the deploy on the UI smoke tests. Integrations shipped broken for weeks because
      # nothing executed the views; a blank-app outage shipped because nothing executed app.js.
      # If this step fails, nothing is deployed.
      - run: npm test
      # Migrations run first and are additive-only; they never delete user data.
      - run: npx wrangler d1 migrations apply closer --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      # Outbound email (TASK-132). Production lives in an account Ivan cannot open, so the
      # Resend key travels as a GitHub secret and is pushed to the Worker here on every deploy
      # if it is set. Recipients are repository VARIABLES (not secrets): addresses, not credentials.
      # With no key set this step does nothing and the app degrades to "stored, not notified".
      - name: Push the Resend key to the Worker (if configured)
        if: ${{ env.EMAIL_API_KEY != '' }}
        run: printf '%s' "$EMAIL_API_KEY" | npx wrangler secret put EMAIL_API_KEY
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - run: npx wrangler deploy --var BUILD_ID:${{ github.sha }} --var INTAKE_TO:"${{ vars.INTAKE_TO }}" --var REPORT_TO:"${{ vars.REPORT_TO }}" --var EMAIL_FROM:"${{ vars.EMAIL_FROM }}"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
