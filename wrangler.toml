name = "closer"
main = "src/index.js"
compatibility_date = "2026-06-01"

# Static UI (ported mockup) served from /public; the Worker handles /api/*
[assets]
directory = "public"
binding = "ASSETS"

# Generation runs as a Workflow, NOT ctx.waitUntil. waitUntil is capped at 30 seconds after
# the response is sent (Cloudflare's documented limit) and generation takes minutes — that cap
# silently killed every run in this project's history at 0:30. Workflows gives unlimited
# per-step WALL-CLOCK time (only CPU is capped), and our work is ~100% I/O wait on Anthropic.
[[workflows]]
name = "closer-generate"
binding = "GENERATE"
class_name = "GenerateWorkflow"

[[d1_databases]]
binding = "DB"
database_name = "closer"
# Local dev (`npm run dev`) uses a local simulated D1 and ignores this.
database_id = "fcd1b2c4-ded2-4a04-87ee-fac05ed5391f"

# TASK-023 — nightly D1 dump. COMMENTED OUT UNTIL R2 IS ENABLED ON THE ACCOUNT.
# `wrangler r2 bucket create closer-backups` returns "Please enable R2 through the Cloudflare
# Dashboard [code: 10042]", which needs someone to accept R2's terms in the dashboard. A binding
# to a bucket that does not exist fails `wrangler deploy`, which would block EVERY deploy, not
# just this feature — so the code ships dark and this stays commented until the bucket is real.
#
# TO TURN IT ON: enable R2 in the dashboard, `npx wrangler r2 bucket create closer-backups`
# (with CLOUDFLARE_ACCOUNT_ID=ca893bd7f2b489d2a9d4177cf3239063), then uncomment this block and
# add "0 9 * * *" to `crons` below. src/backup.js is written, tested and restore-verified.
#
# PRIVATE bucket: the dump contains every transcript, i.e. real sales calls with real clients.
# Never attach an r2.dev or custom domain to it.
# [[r2_buckets]]
# binding = "BACKUPS"
# bucket_name = "closer-backups"

[triggers]
# Every 5 min: poll Fathom for new calls (no-op until keys are configured).
# Sunday 17:00 UTC: weekly edit-analysis -> prompt suggestions.
# 09:00 UTC daily (02:00 Pacific): D1 -> R2 backup — PENDING, see the r2_buckets note above.
# scheduled() routes crons EXHAUSTIVELY; adding one here without a branch there used to mean it
# silently ran the Fathom poller instead.
crons = ["*/5 * * * *", "0 17 * * SUN"]   # add "0 9 * * *" when the R2 bucket exists

# Secrets (set via `wrangler secret put NAME` — NEVER in git):
#   ANTHROPIC_API_KEY, OPENAI_API_KEY
#   FATHOM_API_KEY_OSA
#   GHL_CLIENT_ID, GHL_CLIENT_SECRET  (OAuth — see TASK-018/019)
